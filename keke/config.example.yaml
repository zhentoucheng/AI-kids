# 家庭小克（keke）· 配置模板
# ─────────────────────────────────────────────────────────────
# 用法：cp config.example.yaml config.yaml，然后逐项填。
# 标 ★ 的地方必须改；其余保持默认即可跑起来。
#
# 小克不是"语音助手"，是三个通道组成的一个管家：
#   wake    人喊"小克"                    → 回答
#   fill    小爱答不上来且涉及画面          → 补位
#   steward 到点 / 有人进门 / 孩子在打闹     → 主动开口
# 三条通道共用一个出口：小爱音箱。
#
# 下面大量注释是实测踩出来的（时间戳、次数都是真的），
# 保留它们是因为改配置时这些坑会再踩一遍。

ha:
  url: "http://192.168.1.100:8123"
  # 与小考官同一把 token（2026-10-01 校验通过的版本）
  token: "≪HA_LONG_LIVED_TOKEN≫"
  # ★ 播报通道：小爱接 HA 后只能"念文本"，播不了 HA 合成的音频
  tts_entity: "text.xiaomi_l05c_XXXX_play_text"

# ── 耳朵：小米云对话记录 ────────────────────────────────────────
# 凭据从飞牛 190 的 xiaomusic 同步过来（sync-mitoken.py），容器启动时只读挂载
# token 结构：{passToken, userId, deviceId, micoapi:[deviceId(24), serviceToken(216)]}
#   ★ serviceToken 必须取 micoapi[1]；micoapi[0] 是设备 ID，拿它当 token 必然 401
#
# ★★ device_id 的坑（2026-10-04 实锤）：
#   对话记录接口是**按 deviceId 过滤**的，而这个 deviceId 必须是
#   **小爱音箱**的（来自 xiaomusic setting.json: devices[did].device_id，UUID 格式）。
#   token 里那个 deviceId 字段（16 字符，如 "ubfQBXnW..."）是**登录设备**的 ID，
#   传它进去 → 接口 code=0 但 records 恒为空，看着像"没有记录"。
#   实测：音箱 UUID → 立刻拿到历史；token 里的 → 0 条。
#   留空即自动从 device_file 读（sync-mitoken.py 生成的）。
mi:
  token_path: "/mi/.mi.token"
  device_id: ""                     # 留空 = 自动读 device_file
  device_file: "/mi/mi-device.json"
  hardware: "L05C"
  timeout: 15

mqtt:
  host: "192.168.1.100"
  port: 11883
  username: ""
  password: ""
  client_id: "keke"          # 别叫 kaoguan，会把它挤下线

# ── 眼睛：摄像头取帧 ───────────────────────────────────────────
# go2rtc 无需鉴权；width 由它自己缩放（960 约 44KB、1280 约 61KB）
# 小克只需"看清有没有人/在做什么"，960 够用且快
camera:
  snapshot_url: "http://192.168.1.100:1984/api/frame.jpeg?src=c300&width=960"
  timeout: 15
  # ★ v0.1.8 看图改成**多帧一次请求**。
  #   起因是 2026-10-04 19:55 的实测：同一静止画面连问 15 次，
  #   人数 1 人 13/15（稳），但状态是「打闹 8 / 安静 2 / 空 4」——
  #   纯随机噪声，单帧判定在这种模型上不可能可靠。
  #   一次给 3 帧让模型自己综合判断，耗时和单帧一样（实测平均 5.0s）。
  #   look_frames 调到 5 也不会明显变慢（还是一次请求，只是图多几张）。
  look_frames: 3              # 一次给模型几帧
  look_frame_gap: 1.5         # 帧间隔（秒）。太小会拿到几乎相同的画面，太大孩子可能换位置

# ── 大脑：FreeLLMAPI 统一网关（跑在爱快 192.168.1.1）───────────
llm:
  enabled: true
  base_url: "http://192.168.1.1:31417/v1"
  api_key: "≪YOUR_LLM_API_KEY≫"
  # 顺序即优先级，429/5xx 自动换下一个。
  #   agnes-* 国内直连最稳（约 8 秒）；dots3 带思考过程（解析已容错）；
  #   glm-4.6v 偶发 429 做兜底。
  #   ⚠️ google/gemini-* 国内直连不通，别放进来，每次都要白等一轮超时。
  models:
    - "agnes-2.5-flash"
    - "agnes-2.0-flash"
    - "dots-studio/dots-3-note-preview:free"
    - "glm-4.6v-flash"
  timeout: 60
  max_tokens: 400            # 小克只答一两句，不需要给思考留太多
  max_tokens_long: 1200      # ★ 长内容请求（作文/故事）要留够，400 写半篇文章就断了
  # 视觉描述不需要创造力。0.7 时 agnes 偶发把任务说明复述回来（等于白答），
  # 降到 0.2 后输出稳定得多；代码里还对"复述型"输出做了拦截换模型。
  temperature: 0.2

# ── 唤醒判定 ───────────────────────────────────────────────────
wake:
  # ★★ 同音字表 —— 这条是实测换来的
  #   2026-10-04：兴哥两次喊"小克"，小米云一次转成"小客"、一次转成"小柯"。
  #   同一个唤醒词转出两种写法 → 精确匹配必挂。
  #   这里的字只用于「小X」前缀匹配（小克/小客/小柯/小科/小可…）。
  #   2026-10-04 二次实测又抓到「小哥」：「小哥你看一下客厅有什么」← 喊的就是"小克"
  chars: "克客柯科可刻课嗑恪溘哥"
  # ★ 假阳性词表。判定规则：该词**盖住唤醒匹配位**才否决
  #   （"小哥哥在干嘛"否决；"小克，外卖小哥说啥"照常唤醒）。
  #   ⚠️ 必须写成含"小"+同音字的整词。旧版写的"课堂/功课/客厅"是**死配置**——
  #   这类词前面没有"小"，wake_re 根本匹配不到，等于没写。
  deny:
    - "小哥哥"
    - "小哥们"
    - "小哥俩"
    - "小可爱"
    - "小可怜"
    - "小课堂"
    - "小课本"
    - "小课程"
    - "小课题"
    - "小科学"
    - "小科长"
    - "小柯基"
    - "小刻苦"
    - "小磕碰"
    # 注：「外卖小哥」「快递小哥」不用列 —— 它们的"小哥"不在句首，
    #     盖不到唤醒位（真喊"小克"时转出的"小哥"是句首），列了反而误杀。

# ── B 通道：小爱认输话术（判断的是**小爱的回复**，不是用户说的）──
# 实测 2026-10-04 抓到的小爱原话，命中任一即算"它答不上来"
surrender_phrases:
  - "这可把我难住了"
  - "我暂时还回答不上"
  - "回答不上"
  - "再学习学习"
  - "我还需要学习"
  - "我还在学习中"        # ← 2026-10-04 漏判元凶，小爱原话"对不起， 我还在学习中!"
  - "先聊点别的"          # ← "这个问题我还在学习中， 先聊点别的吧"
  - "该指令暂不支持"
  - "暂不支持"
  - "没有找到可控制的设备"
  - "听不懂"
  - "没听懂"
  - "我还不会"
  - "我还没学会"
  - "超出我的能力"

# ★ 兜底正则（比逐条列举可靠）。小爱话术是**随机变体**：2026-10-04 一天就抓到
#   四种不同说法（这可把我难住了 / 我暂时还回答不上 / 我还在学习中 / 该指令暂不支持），
#   光靠 phrases 列举一定会有漏的。命中即算"小爱认输"，
#   再由下面的 vision_intent 做第二道关，双重条件防小克到处插嘴。
surrender_regex: "学习中|学一学|学习学习|没学会|还不会|回答不上|难住|暂不支持|没找到可控制|听不懂|没听懂|超出.{0,4}能力|帮不上|不太会|不明白|不会这个"

# ── B 通道：视觉意图词（用户这句话里得沾点"看"的意思）──────────
# 为什么必须卡这一层：小爱对一大堆无关话题也会说"这可把我难住了"，
# 只按"它认输就接管"会让小克在客厅到处插嘴（孩子说句"这题我不会"都能触发）。
vision_intent:
  - "看"
  - "看见"
  - "看到"
  - "瞧"
  - "几个人"
  - "几人"
  - "有没有人"
  - "是什么"
  - "什么样的"
  - "什么颜色"
  - "谁"
  - "在哪"
  - "在做什么"
  - "在干嘛"
  - "手里"
  - "身上"
  - "客厅"
  - "房间"
  - "画面"
  - "摄像头"
  - "镜头"
  - "认得"
  - "认识"
  - "穿"
  - "拿"

trigger:
  auto_fill: true            # B 通道总开关（想只留显式唤醒就改 false）
  poll_interval: 2.0         # 实测 2s → lag 0.3~1.3s，够实时
  speak_delay: 2.5           # 读到记录后等这么久再开口，让小爱把话说完再插
  min_gap_seconds: 8         # 两次回答最短间隔（只约束补位通道）
  min_gap_wake_seconds: 2    # ★ 显式唤醒只用 2 秒防抖。
                             #   实测 13:23:24 喊"小克客厅有多少个人"，被 8 秒闸门
                             #   当成"距上次回答 1.2s"无视掉 → 用户感受是"喊了不理"，
                             #   比多播一次糟得多。喊了就该答。
  max_len: 120               # 单句超长不处理（多半是别的语音/电视声）
  fill_max_len: 20           # ★ 补位通道额外限长：无唤醒词时，句子超过这个长度不补位。
                             #   真实案例：兴哥在家里聊天"…都可以基于这个摄像头…"（29字）
                             #   小爱答不上 + 含"摄像头" → 差点被当视觉提问。
                             #   显式唤醒（"小克…"）不受这条限制。
  answer_max_chars: 150      # 普通回答播报上限（再长 TTS 念不完等于白答）
  long_max_chars: 500        # ★ 长内容请求（作文/故事/总结）上限，识别见 keke.LONG_RE。
                             #   实测 13:24「此情此景你帮我写一篇作文」按 80 字截断 →
                             #   只念了个开头就停。这类需求天生要长输出。
                             #   ★ v0.1.4 追加：作文「只报画面内容、不像作文」的根因**不在这**，
                             #   在 _system_prompt —— 旧版整段都在说"你是来看画面的"，
                             #   模型当然只交画面描述。已重写成三类意图分流（问画面/搞创作/闲聊）。
  continue_window_s: 600     # ★ v0.1.4：上一轮长内容之后，多久内说「继续」算续写（秒）。
                             #   作文天生超过播报上限，念完必然停；用户想听后半段只能喊
                             #   「小克，继续」。判据：CONTINUE_RE 命中 + mode=wake +
                             #   上一轮是长内容 + 窗口内，四个条件全中才接。
  speak_chunk_chars: 80      # ★ 分段播报每段字数。长内容一次性塞给 text.set_value
                             #   会"后句盖前句"，必须按句读切段 + 按语速估算间隔
  tts_chars_per_second: 4.5  # 中文 TTS 语速，估"说完要多久"

# ── 管家模式：小克自己看时机开口 ───────────────────────────────
# 原来小克只有两条通道：① 你喊"小克"它就答 ② 小爱答不上来 + 话里带视觉意图，它补位。
# 管家模式是第三条：**它自己判断该不该说话**（放学回家、该写作业了、俩孩子在打闹）。
#
# ⚠️ 三条硬限制，先认清否则期望会落空：
#   1. **耳朵只认音箱**。孩子在客厅随口回一句"做完了"，小克听不到 ——
#      必须对着音箱说"小爱同学，做完了"才会留下记录。所以主动提问本质是
#      **单向提醒**；reply_window_s 那个回执窗口只是"孩子真答了就收下"。
#   2. L05C 的唤醒词烧在固件里，主动播报只能单向说，开不了对话。
#   3. 主动说话会跟小考官抢麦，这里复用 MQTT 的 yield_to_kaoguan 互斥。
steward:
  enabled: true
  # ★ 只演练不开口：true 时照样走完整决策 + 抓帧 + 记日志，但**不真的播报**。
  #   刚上线那两天先设 true 观察一下日志（看它打算说什么、有没有误判）更稳，
  #   觉得靠谱了再改回 false。容器日志里搜「[dry]」能看到它本来想说什么。
  dry_run: false
  # 放假日（周六周日自动算，不用写）。2026 国庆 + 中秋调休
  #   ⚠️ 这是按公开放假安排猜的，请兴哥核对实际日期，不对直接改这里。
  holidays:
    - "2026-10-01"
    - "2026-10-02"
    - "2026-10-03"
    - "2026-10-04"
    - "2026-10-05"
    - "2026-10-06"
    - "2026-10-07"
    - "2026-10-08"
  # ★ v0.1.6：调休补班/补课日 —— 写进来的日期**强制算上学日**。
  #   中国调休制度下，长假前后的周六周日经常要上课，只按周末判会把补课日
  #   当成放假：孩子全天在校，小克却按假期班表走，上午九点半对着空客厅
  #   喊"今天玩得开心吗"。判定优先级 workdays > 周末 > holidays。
  #   2026 国庆的补课日请兴哥确认后填进来，例如：
  #     - "2026-10-10"
  #     - "2026-10-11"
  workdays: []
  # ★ v0.1.9 由 21:45 改成 22:00（兴哥 2026-10-04 定的）：
  #   21:45–22:00 这 15 分钟小克还会开口，夜里吵到人。
  #   注意这只管**管家主动开口**，不管两件事（都是故意的）：
  #     ① 你喊"小克"（wake 通道）—— 喊了就该答，半夜想查个时间当然要应。
  #     ② 门锁的「回家自动播英语」—— 那条链路是 HA 自动化，不经过这里，
  #        所以早上 7 点开始播英语不受影响（正是兴哥要的效果）。
  quiet_hours: ["22:00", "07:30"]   # 这个区间内不主动开口（孩子睡了/还没起）
  min_gap_seconds: 150              # 两次主动说话最短间隔，防连珠炮
  reply_window_s: 90                # 主动提问后多久内、孩子对音箱说的话算"回答"

  # ① 放学回家问候（上学日）。窗口内先探"有没有人进门"信号，没迹象就不说 ——
  #   不做这一步的话，孩子还没到家小克就对着空客厅喊"回来啦"，很傻。
  #
  # ★★ v0.2.0 修正窗口（2026-11-04 全天对账）：
  #   `_in_window` 的语义是「从 at 起、往后 window_min 分钟」，**不是**前后对称。
  #   所以原来的 16:40/35 实际只覆盖 16:40–17:15，17:40/35 只覆盖 17:40–18:15。
  #   当天姐姐 15:26 就到家（周三放学早），离窗口开还差 2 小时 14 分，
  #   `_in_window` 直接放行通过 —— 门锁在 HA 里记得清清楚楚，小克压根不去看。
  #   → at 改成"最早可能到家的时刻"，window 一路铺到"最晚到家之后"。
  #   ⚠️ 窗口放宽会带进别人的开门（当天有奶奶 15:34、爸爸 18:17），
  #      所以配套做了人名核对（见 _decide 里 who != slot.person 那道闸），
  #      两件事必须一起改，只放宽窗口不核对会喊错人。
  arrival:
    enabled: true
    slots:
      - person: "妹妹"            # 妹妹，16:36 到家；窗口 15:30–17:30
        at: "15:30"
        window_min: 120
      - person: "姐姐"            # 姐姐，15:26 到家；窗口 15:00–19:00
        at: "15:00"
        window_min: 240

  # ② 放假在家的问候（周末/节假日）
  #   ★ v0.1.6 改成"进门就问候"。原来只有 09:30 问一次，可放假期孩子一大早
  #     就在家了，09:30 之后一整天（到 20:45 睡前）小克再没说过话。
  #     实际场景是：上午出门玩 → 中午回来吃饭 → 下午再出去 → 傍晚回来，
  #     每次进门都该问候一句"今天玩得开心嘛"。
  #   mode: arrival = 挂在"进门迹象"上（门锁 outside_unlock / 摄像头有人移动）
  #   mode: clock   = 老的固定时间点模式（at + window_min）
  holiday_greet:
    enabled: true
    mode: "arrival"
    at: "09:30"                # mode=clock 时用
    window_min: 150            # mode=clock 时用
    # —— 以下仅 arrival 模式生效 ——
    active_from: "08:30"       # 这个区间之外不问（太早孩子在睡、太晚该洗漱了）
    active_to: "20:00"
    # ★ v0.1.7 放宽（2026-10-04 实测 17:07 漏播复盘）：
    #   原来 3 次 / 90 分钟。兴哥家今天实际进门序列是
    #   14:06（旧的误触发）→ 16:10（奶奶）→ 17:07（妹妹）→ 18:46（奶奶），
    #   一天 4 次真实进门，3 次上限**必然拦掉最后一次**；
    #   16:11 + 90 分钟 = 17:41，17:07 差 34 分钟被 min_gap 挡掉。
    #   假期孩子进进出出本来就多，上限给到 6 次、间隔收到 45 分钟。
    #   真正防重复的是下面 arrival_within_s（15 分钟内同一事件只算一次）。
    max_per_day: 6             # 一天最多问候 6 次（按 4 次真实进门 + 余量）
    min_gap_min: 45            # 两次假期问候至少隔 45 分钟
    arrival_within_s: 900      # 15 分钟内算"刚进门"
    # ★★ 必须 true（2026-10-04 实测教训）：只认门锁「从外面开门」outside_unlock。
    #   设 false 会退到摄像头"有人移动"兜底 —— 可孩子在家写一下午作业，
    #   这个信号一直是真，等于把"在家活动"当成"反复进门"，一天问候三次。
    #   门锁记录是查**历史**而不是当前状态：真实序列是 outside_unlock → 几秒后
    #   lock_inside（自动上锁），读当前状态必然漏掉每一次进门。
    door_only: true

  # ③ 作业追问：到家后 delay 分钟问一次；没探到"到家"就退到 fallback_at
  homework:
    enabled: true
    delay_after_arrival_min: 45
    fallback_at: "19:00"
    window_min: 60

  # ④ 打闹提醒：活跃时段每隔 interval_s 抓帧看一眼
  #    ★ confirm_times 必须 ≥2：实测同一场景连问三次，模型给出的是
  #      「3人打闹 / 1人 / 2人安静」—— 单帧判定不能信。误报一次就是对着
  #      安静写作业的孩子喊"别闹了"，比漏报糟。连续 confirm_times 次都判"打闹"
  #      （且画面里 ≥2 人）才开口。
  #    成本提示：每次约 3–6 秒模型调用。已经加了"15 分钟内没人移动就跳过"的
  #    省流判断，客厅没人时不会白跑。
  #    ★ v0.1.6：时段按上学日/放假**分两套**。原来只有一个 16:00–21:00，是照
  #      "放学后"排的 —— 国庆长假孩子全天在家，白天闹翻天它一声不吭。
  #      放假这套故意把 interval 放宽到 300s（5 分钟一次）：假期一天 12 小时，
  #      按 150s 就是 288 次模型调用，而且孩子在家打滚玩闹比写作业时更容易被
  #      误判成"打闹"，喊太勤会烦人。cooldown 也拉到 1800s（半小时）。
  #      想放假也严一点就把 interval_s 调回 150。
  fight:
    enabled: true
    workday:
      from: "16:00"            # 上学日：放学后到睡前
      to: "21:00"
      interval_s: 150
      cooldown_s: 1200
    holiday:
      from: "09:00"            # 放假：起床后到睡前，全天覆盖
      to: "21:00"
      interval_s: 300
      cooldown_s: 1800
    confirm_times: 2           # 连续 2 次都判"打闹"才开口（单帧判定不可信）
    # ★ v0.1.7 新增 min_people（2026-10-04 实测 23 次触发 0 次开口复盘）：
    #   原来硬编码 `n >= 2` 才累加确认次数。实测日志里大量
    #   「人数=1 状态=打闹」「人数=0 状态=打闹」→ 人数不够、fight_hits 恒为 0，
    #   一整天 23 次「疑似打闹（第 0/2 次确认）」、**0 次真正开口**，功能形同虚设。
    #   人数自己都抠不出来时（look 里 n 缺失/0）不该无条件判真打闹，
    #   所以下限做成可配，且允许"模型说打闹但人数读不出来"时按人数下限兜底。
    min_people: 2              # 判打闹所需最低人数；设 1 可让单人追逐也算
    #   抠不出人数时的容错：true = 模型明确说"打闹"就信（人数读数不可靠时用）
    trust_state_when_no_people: false

  # ⑤ 睡前收尾：问一句今天学了什么
  bedtime:
    enabled: true
    at: "20:45"
    window_min: 45

  state_file: "/app/steward-state.json"
  memory_dir: "/app/memory"

# ── 别跟小考官抢麦 ─────────────────────────────────────────────
# 订阅 kaoguan/state 拿 asking 字段；考官在出题/报答案时小克闭嘴。
# （门锁"回家自动播英语"那条链路目前没有状态通道，暂时只能靠人耳判断）
yield_to_kaoguan:
  enabled: true
  asking_quiet_seconds: 45

state_file: "/app/keke-state.json"

# ── Frigate 人脸识别（2026-10-19）─────────────────────────────
# 小克以前只订阅 frigate/events，但 sub_label 是事件驱动的：人坐着写作业不动，
# 可能一小时才来一条 → 问「这是谁」经常拿不到先验，只能让模型猜。
# 改成直接查 API。8971 是 HTTPS + cookie 登录（/api/login），不是 basic auth。
frigate:
  api: "https://192.168.1.100:8971"
  user: "admin"
  password: "≪YOUR_PASSWORD≫"
  face_lookback_min: 120     # Frigate 人脸事件稀疏，30 分钟实测常为空
